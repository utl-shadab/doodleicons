name: Publish npm packages
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to publish
        required: true
        type: string
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    environment: npm-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run release:check
      - name: Verify requested version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node -e "for(const name of ['core','react']){const p=require('./packages/'+name+'/package.json');if(p.version!==process.env.RELEASE_VERSION)throw new Error('Version mismatch')}"
      - run: npm run build:packages
      - run: npm run build:figma
      - run: npm run typecheck
      - run: npm test
      - run: npm publish --workspace doodle-icon --access public --provenance
      - run: npm publish --workspace doodle-icon-react --access public --provenance
