name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run build:packages
      - run: npm run build:figma
      - run: npm run typecheck
      - run: npm test
      - run: npm run build --workspace @doodleicons/website
      - run: npm run pack:icons
      - run: npm run smoke:consumer
      - uses: actions/upload-artifact@v4
        with:
          name: doodleicons-packages-and-figma
          path: |
            artifacts/packages/*.tgz
            apps/figma-plugin/dist/
          retention-days: 14
